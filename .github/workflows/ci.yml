name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Test, Build, Audit
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      APP_ENV: test
      CI: true
      E2E_RUN_LIVE: "false"
      E2E_RUN_MUTATIONS: "false"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            admin_backend/package-lock.json
            frontend/package-lock.json
            admin_frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix admin_backend ci
          npm --prefix frontend ci
          npm --prefix admin_frontend ci

      - name: Lint
        run: npm run lint:all

      - name: Typecheck, tests, and builds
        run: npm run check:all

      - name: Production dependency audits
        run: |
          npm audit --omit=dev
          npm --prefix backend audit --omit=dev
          npm --prefix admin_backend audit --omit=dev
          npm --prefix frontend audit --omit=dev
          npm --prefix admin_frontend audit --omit=dev
