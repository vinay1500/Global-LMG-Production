# Public website SPA for Global LMG.
# Replace globallmg.example with the real public domain and SSL certificate paths.

server {
    listen 80;
    server_name globallmg.example www.globallmg.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name globallmg.example www.globallmg.example;

    ssl_certificate /etc/letsencrypt/live/globallmg.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globallmg.example/privkey.pem;

    root /srv/global-lmg/current/frontend/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://docs.google.com https://forms.gle; img-src 'self' data: blob: https://*.gstatic.com https://*.googleusercontent.com https://maps.googleapis.com https://maps.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://accounts.google.com https://apis.google.com https://maps.googleapis.com https://maps.gstatic.com; connect-src 'self' https://api.globallmg.org https://*.razorpay.com https://accounts.google.com https://www.googleapis.com https://maps.googleapis.com https://*.ingest.sentry.io https://*.sentry.io; frame-src 'self' blob: https://*.razorpay.com https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob: data:; upgrade-insecure-requests" always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
