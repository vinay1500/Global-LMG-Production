# Admin API reverse proxy.
# Replace admin-api.globallmg.example with the real admin API domain.

upstream global_lmg_admin_api {
    server 127.0.0.1:3005;
    keepalive 32;
}

server {
    listen 80;
    server_name admin-api.globallmg.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin-api.globallmg.example;

    ssl_certificate /etc/letsencrypt/live/admin-api.globallmg.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-api.globallmg.example/privkey.pem;

    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Optional Resend webhook IP allowlist.
    #
    # Keep this disabled unless you have verified the current Resend webhook
    # egress ranges from Resend docs/dashboard and have an owner for keeping
    # them current. App-level Svix signature verification remains mandatory.
    #
    # To enable, uncomment this exact location block, replace the TEST-NET CIDRs
    # with verified provider CIDRs, and keep it above the broader webhook block.
    #
    # location = /api/v1/webhooks/resend {
    #     allow 203.0.113.0/24; # replace with verified Resend CIDR
    #     allow 198.51.100.10;  # replace with verified Resend IP
    #     deny all;
    #
    #     proxy_pass http://global_lmg_admin_api/api/v1/webhooks/resend;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Host $host;
    #     proxy_set_header X-Forwarded-Port 443;
    #     proxy_set_header X-Forwarded-Proto https;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_read_timeout 75s;
    # }
    #
    # Optional Twilio status webhook IP allowlist.
    #
    # Keep this disabled unless you have verified the current Twilio webhook
    # egress ranges from Twilio docs/dashboard and have an owner for keeping
    # them current. App-level Twilio signature verification remains mandatory.
    #
    # location = /api/v1/webhooks/twilio/status {
    #     allow 203.0.113.0/24; # replace with verified Twilio CIDR
    #     allow 198.51.100.10;  # replace with verified Twilio IP
    #     deny all;
    #
    #     proxy_pass http://global_lmg_admin_api/api/v1/webhooks/twilio/status;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Host $host;
    #     proxy_set_header X-Forwarded-Port 443;
    #     proxy_set_header X-Forwarded-Proto https;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_read_timeout 75s;
    # }

    location /api/v1/admin/ {
        proxy_pass http://global_lmg_admin_api/api/v1/admin/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }

    location /api/v1/webhooks/ {
        proxy_pass http://global_lmg_admin_api/api/v1/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
}
