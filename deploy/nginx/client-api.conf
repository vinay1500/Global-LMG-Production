# Client API reverse proxy.
# Replace api.globallmg.example with the real client API domain.

upstream global_lmg_client_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name api.globallmg.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.globallmg.example;

    ssl_certificate /etc/letsencrypt/live/api.globallmg.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.globallmg.example/privkey.pem;

    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Optional Razorpay webhook IP allowlist.
    #
    # Keep this disabled unless you have verified the current Razorpay webhook
    # egress ranges from Razorpay docs/dashboard and have an owner for keeping
    # them current. App-level Razorpay signature verification remains mandatory.
    #
    # To enable, uncomment this exact location block, replace the TEST-NET CIDRs
    # with verified provider CIDRs, and keep it above the broader /api/v1/ block.
    #
    # location = /api/v1/webhooks/razorpay {
    #     allow 203.0.113.0/24; # replace with verified Razorpay CIDR
    #     allow 198.51.100.10;  # replace with verified Razorpay IP
    #     deny all;
    #
    #     proxy_pass http://global_lmg_client_api/api/v1/webhooks/razorpay;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Host $host;
    #     proxy_set_header X-Forwarded-Port 443;
    #     proxy_set_header X-Forwarded-Proto https;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_read_timeout 75s;
    # }

    location /api/v1/ {
        proxy_pass http://global_lmg_client_api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
}
